version: 1.1
kind: operation
name: nanort-muon-sweep
description: >
  Matrix sweep do Muon optimizer: roda 3 jobs em paralelo (muon_lr 5e-3, 1e-2, 2e-2),
  cada um por 45 min em 1xH200, para selecionar o melhor LR do Record #2.
matrix:
  kind: grid
  params:
    muon_lr:
      kind: choice
      value: [0.005, 0.01, 0.02]
component:
  name: nanort-train
  description: NanoRT training run com Muon optimizer (sweep de LR).
  queue: nebius/default
  inputs:
    - name: holdout_db
      type: str
      isOptional: true
      value: rel-avito
    - name: hf_artifacts_repo
      type: str
      isOptional: true
      value: gabrielveloso/nanort-artifacts
    - name: wandb_project
      type: str
      isOptional: true
      value: modded-nanort
    - name: seed
      type: int
      isOptional: true
      value: 0
    - name: val_eval_freq
      type: int
      isOptional: true
      value: 500
    - name: batch_size
      type: int
      isOptional: true
      value: 256
    - name: optimizer
      type: str
      isOptional: true
      value: muon
    - name: muon_lr
      type: float
      isOptional: false
    - name: hf_token
      type: str
      isOptional: true
      value: ""
  cache:
    disable: true
  termination:
    maxRetries: 0
  run:
    kind: job
    connections: [wandb-connection]
    environment:
      nodeSelector:
        polyaxon: h200
    init:
      - file:
          content: |
            from polyaxon import tracking
            tracking.init()
          filename: init.py
    container:
      resources:
        limits:
          nvidia.com/gpu: "1"
      command:
        - bash
        - "-c"
        - |
          exec > >(tee {{ globals.run_outputs_path }}/log.txt) 2>&1
          set -eu
          apt-get update && apt-get install -y curl
          curl -fsSL https://pixi.sh/install.sh | sh
          export PATH="$HOME/.pixi/bin:$PATH"
          cd {{ globals.run_artifacts_path }}/uploads
          pixi install
          cd rustler && pixi run maturin develop --uv --release && cd ..
          mkdir -p ~/scratch/pre
          pip3 install --root-user-action ignore polyaxon huggingface_hub hf_transfer
          python3 {{ globals.run_outputs_path }}/init.py
          export WANDB_USER_EMAIL="{{ globals.user_email }}"
          hf download {{ hf_artifacts_repo }} --repo-type dataset --include "holdout-{{ holdout_db }}/train/*" --local-dir ~/scratch/nanort_artifacts
          ln -sf ~/scratch/nanort_artifacts/holdout-{{ holdout_db }}/train ~/scratch/pre/nanort-train-{{ holdout_db }}
          hf download {{ hf_artifacts_repo }} --repo-type dataset --include "holdout-{{ holdout_db }}/val/*" --local-dir ~/scratch/nanort_artifacts
          ln -sf ~/scratch/nanort_artifacts/holdout-{{ holdout_db }}/val/{{ holdout_db }} ~/scratch/pre/nanort-val-{{ holdout_db }}
          pixi run python scripts/nanort_train.py --holdout-db {{ holdout_db }} --optimizer {{ optimizer }} --muon-lr {{ muon_lr }}
      image: "pytorch/pytorch:2.5.0-cuda12.4-cudnn9-devel"
      name: polyaxon-main
      workingDir: "{{ globals.run_artifacts_path }}/uploads"
      env:
        - name: WANDB_PROJECT
          value: "{{ wandb_project }}"
        - name: WANDB_TAGS
          value: "nanort-train,muon,{{ holdout_db }}"
        - name: WANDB_RUN_GROUP
          value: "record-02-muon-sweep"
        - name: TEAM_WANDB
          value: franciscokunumi-universidade-federal-de-minas-gerais
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        - name: HF_TOKEN
          value: "{{ hf_token }}"
        - name: NANORT_SEED
          value: "{{ seed }}"
        - name: NANORT_VAL_EVAL_FREQ
          value: "{{ val_eval_freq }}"
        - name: NANORT_BATCH_SIZE
          value: "{{ batch_size }}"
