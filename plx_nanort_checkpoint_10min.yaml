version: 1.1
kind: component
name: nanort-checkpoint-10min
description: >
  NanoRT checkpoint run: train a baseline/Muon model for a short active-time
  budget, save the checkpoint, and upload it to HuggingFace.
queue: nebius/default
inputs:
  - name: holdout_db
    description: Held-out RelBench database.
    type: str
    isOptional: true
    value: rel-avito
  - name: hf_artifacts_repo
    description: HuggingFace dataset repo containing the NanoRT artifacts.
    type: str
    isOptional: true
    value: gabrielveloso/nanort-artifacts
  - name: hf_checkpoint_repo
    description: HuggingFace repo where checkpoints will be uploaded.
    type: str
    isOptional: true
    value: GabrielVeloso/NanoRT
  - name: hf_checkpoint_repo_type
    description: HuggingFace repo type for checkpoint upload.
    type: str
    isOptional: true
    value: model
  - name: checkpoint_prefix
    description: Prefix used for the checkpoint folder on HuggingFace.
    type: str
    isOptional: true
    value: nanort-10min
  - name: wandb_project
    description: W&B project name.
    type: str
    isOptional: true
    value: modded-nanort
  - name: seed
    description: Random seed.
    type: int
    isOptional: true
    value: 0
  - name: val_eval_freq
    description: Log val/auroc_zero_shot every N training steps.
    type: int
    isOptional: true
    value: 100
  - name: batch_size
    description: Training batch size.
    type: int
    isOptional: true
    value: 256
  - name: optimizer
    description: Optimizer to use, either adamw or muon.
    type: str
    isOptional: true
    value: muon
  - name: muon_lr
    description: Muon group learning rate, ignored when optimizer=adamw.
    type: float
    isOptional: true
    value: 0.005
  - name: time_budget_minutes
    description: Active training time budget before saving the checkpoint.
    type: float
    isOptional: true
    value: 10
  - name: hf_token
    description: HuggingFace token for artifact download and checkpoint upload.
    type: str
    isOptional: true
    value: ""
cache:
  disable: true
termination:
  maxRetries: 0
run:
  kind: job
  connections: [wandb-connection]
  environment:
    nodeSelector:
      polyaxon: h200
  init:
    - file:
        content: |
          from polyaxon import tracking
          tracking.init()
        filename: init.py
  container:
    resources:
      limits:
        nvidia.com/gpu: "1"
    command:
      - bash
      - "-c"
      - |
        exec > >(tee {{ globals.run_outputs_path }}/log.txt) 2>&1
        set -eu
        apt-get update && apt-get install -y curl
        curl -fsSL https://pixi.sh/install.sh | sh
        export PATH="$HOME/.pixi/bin:$PATH"
        cd {{ globals.run_artifacts_path }}/uploads
        pixi install
        cd rustler && pixi run maturin develop --uv --release && cd ..
        mkdir -p ~/scratch/pre
        pip3 install --root-user-action ignore polyaxon huggingface_hub hf_transfer
        python3 {{ globals.run_outputs_path }}/init.py
        export WANDB_USER_EMAIL="{{ globals.user_email }}"
        hf download {{ hf_artifacts_repo }} --repo-type dataset --include "holdout-{{ holdout_db }}/train/*" --local-dir ~/scratch/nanort_artifacts
        ln -sf ~/scratch/nanort_artifacts/holdout-{{ holdout_db }}/train ~/scratch/pre/nanort-train-{{ holdout_db }}
        hf download {{ hf_artifacts_repo }} --repo-type dataset --include "holdout-{{ holdout_db }}/val/*" --local-dir ~/scratch/nanort_artifacts
        ln -sf ~/scratch/nanort_artifacts/holdout-{{ holdout_db }}/val/{{ holdout_db }} ~/scratch/pre/nanort-val-{{ holdout_db }}

        CKPT_DIR="ckpts/{{ checkpoint_prefix }}-{{ holdout_db }}-{{ optimizer }}-s{{ seed }}"
        RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-${RANDOM}"
        HF_CKPT_PATH="checkpoints/{{ holdout_db }}/{{ checkpoint_prefix }}/seed-{{ seed }}-${RUN_ID}"

        pixi run python scripts/nanort_train.py \
          --holdout-db {{ holdout_db }} \
          --optimizer {{ optimizer }} \
          --muon-lr {{ muon_lr }} \
          --time-budget-minutes {{ time_budget_minutes }} \
          --save-ckpt-dir "$CKPT_DIR"

        mkdir -p "$CKPT_DIR"
        cat > "$CKPT_DIR/metadata.json" <<EOF
        {
          "holdout_db": "{{ holdout_db }}",
          "optimizer": "{{ optimizer }}",
          "muon_lr": {{ muon_lr }},
          "seed": {{ seed }},
          "time_budget_minutes": {{ time_budget_minutes }},
          "polyaxon_run_path": "{{ globals.run_outputs_path }}",
          "hf_checkpoint_path": "$HF_CKPT_PATH"
        }
        EOF
        find "$CKPT_DIR" -maxdepth 2 -type f | sort | tee {{ globals.run_outputs_path }}/checkpoint_manifest.txt
        printf "%s\n" "$HF_CKPT_PATH" > {{ globals.run_outputs_path }}/hf_checkpoint_path.txt
        hf upload {{ hf_checkpoint_repo }} "$CKPT_DIR" "$HF_CKPT_PATH" --repo-type {{ hf_checkpoint_repo_type }}
    image: "pytorch/pytorch:2.5.0-cuda12.4-cudnn9-devel"
    name: polyaxon-main
    workingDir: "{{ globals.run_artifacts_path }}/uploads"
    env:
      - name: WANDB_PROJECT
        value: "{{ wandb_project }}"
      - name: WANDB_TAGS
        value: "nanort-checkpoint,{{ holdout_db }},{{ optimizer }}"
      - name: WANDB_RUN_GROUP
        value: "nanort-checkpoint-10min"
      - name: TEAM_WANDB
        value: franciscokunumi-universidade-federal-de-minas-gerais
      - name: HF_HUB_ENABLE_HF_TRANSFER
        value: "1"
      - name: HF_TOKEN
        value: "{{ hf_token }}"
      - name: NANORT_SEED
        value: "{{ seed }}"
      - name: NANORT_VAL_EVAL_FREQ
        value: "{{ val_eval_freq }}"
      - name: NANORT_BATCH_SIZE
        value: "{{ batch_size }}"
