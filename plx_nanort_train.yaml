version: 1.1
kind: component
name: nanort-train
description: >
  NanoRT training run com Muon optimizer: pretrain RT for 45 minutes on 1xH200,
  leaving one database held out, and log zero-shot AUROC on the fixed val artifact.
queue: nebius/default
inputs:
  - name: holdout_db
    description: >
      Held-out RelBench database. Training uses all other databases; zero-shot
      AUROC is evaluated on this database's val artifact.
    type: str
    isOptional: false
  - name: hf_artifacts_repo
    description: >
      HuggingFace dataset repo containing the NanoRT artifacts
      (produced by plx_nanort_build_upload_relations_holdout.yaml).
      Example: "franciscogaluppo/nanort-artifacts"
    type: str
    isOptional: false
  - name: wandb_project
    description: W&B project name.
    type: str
    isOptional: true
    value: nanort-train
  - name: seed
    description: Random seed (run multiple seeds for std_across_seeds in select_holdout.py).
    type: int
    isOptional: true
    value: 0
  - name: val_eval_freq
    description: Log val/auroc_zero_shot every N training steps.
    type: int
    isOptional: true
    value: 100
  - name: max_steps
    description: Hard step cap; wall-clock budget normally stops first.
    type: int
    isOptional: true
    value: 1000000
  - name: lr_total_steps
    description: >
      OneCycleLR horizon for AdamW. Set to 1000000 when testing with a small
      max_steps so the LR schedule matches the real competition run.
      Defaults to max_steps if not set (set to 0 to use max_steps).
    type: int
    isOptional: true
    value: 0
  - name: time_budget_minutes
    description: Active training time budget in minutes.
    type: float
    isOptional: true
    value: 45
  - name: batch_size
    description: Training batch size. Increase to improve GPU utilization.
    type: int
    isOptional: true
    value: 256
  - name: optimizer
    description: Optimizer to use — "adamw" (baseline) or "muon".
    type: str
    isOptional: true
    value: muon
  - name: muon_lr
    description: Muon group learning rate (ignored when optimizer=adamw).
    type: float
    isOptional: true
    value: 0.005
  - name: simplicial_layers
    description: >
      Block indices with simplicial attention: "all", "none" or e.g. "0,4,8".
      Fewer blocks cut step-time linearly.
    type: str
    isOptional: true
    value: all
  - name: update_relations
    description: >
      "1" (default) = dynamic relation stream (RelAttn updates r each block);
      "0" = static relation operators (HGT-style), r keeps its frozen init r^(0).
    type: str
    isOptional: true
    value: "1"
  - name: qk_norm
    description: >
      "1" (default) = per-head RMSNorm on the trilinear score factors
      (q, k, kr) to tame logit-variance / entropy collapse; "0" = disable.
    type: str
    isOptional: true
    value: "1"
  - name: sigreg_layer
    description: >
      Block index whose cell hidden state is SIGReg-regularized. -1 (default)
      disables SIGReg, leaving the simplicial-only run.
    type: int
    isOptional: true
    value: -1
  - name: sigreg_lambda_row
    description: SIGReg row-view loss coefficient (0 = off).
    type: float
    isOptional: true
    value: 0.0
  - name: sigreg_lambda_col
    description: SIGReg column-view loss coefficient (0 = off; record used col).
    type: float
    isOptional: true
    value: 0.0
  - name: sigreg_n_proj
    description: Number of random projections used by SIGReg.
    type: int
    isOptional: true
    value: 64
  - name: sigreg_lr
    description: SIGReg projector LR (0 = defaults to the main lr).
    type: float
    isOptional: true
    value: 0.0
  - name: sigreg_min_group
    description: Minimum group size for the SIGReg statistic.
    type: int
    isOptional: true
    value: 8
  - name: sigreg_col_pool
    description: 1 = pool the column view globally across the batch.
    type: int
    isOptional: true
    value: 1
  - name: hf_token
    description: HuggingFace token for higher rate limits on artifact download.
    type: str
    isOptional: true
    value: ""
cache:
  disable: true
termination:
  maxRetries: 0
run:
  kind: job
  connections: [wandb-connection]
  environment:
    nodeSelector:
      polyaxon: h200
  container:
    resources:
      limits:
        nvidia.com/gpu: "1"
    command:
      - bash
      - "-lc"
      - |
        exec > >(tee {{ globals.run_outputs_path }}/log.txt) 2>&1
        set -euxo pipefail
        export PYTHONUNBUFFERED=1

        log_step() {
          echo
          echo "================================================================"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"
          echo "================================================================"
        }

        # NOTE: apt packages, pixi, polyaxon and the HF helpers are all baked
        # into the image (gabrielmveloso/nanort). This block only registers the
        # run, re-links the pixi env from the warm cache, and builds rustler.

        log_step "Initializing Polyaxon tracking (best-effort; polyaxon prebaked)"
        # polyaxon is already installed in the image; just register the run early
        # so outputs/log.txt persists even if a later step fails (set -e).
        python3 - <<'PY' || echo "WARNING: tracking.init() failed; continuing"
        from polyaxon import tracking
        tracking.init()
        PY

        log_step "Installing pixi environment (fast: re-link from prebaked cache)"
        export PATH="$HOME/.pixi/bin:$PATH"
        cd {{ globals.run_artifacts_path }}/uploads
        pixi install --locked

        log_step "Building rustler extension (crates prefetched)"
        cd rustler && pixi run maturin develop --uv --release && cd ..

        log_step "Preparing scratch dir"
        mkdir -p ~/scratch/pre

        log_step "Exporting environment variables"
        export WANDB_USER_EMAIL="{{ globals.user_email }}"
        export HF_HUB_ENABLE_HF_TRANSFER=1
        set +x
        if [ -n "${HF_TOKEN:-}" ]; then
          echo "[hf] token provided"
        else
          echo "[hf] token not provided; downloads must be public"
        fi
        set -x

        log_step "Downloading ra-holdout-{{ holdout_db }} artifacts"
        hf download {{ hf_artifacts_repo }} --repo-type dataset --include "ra-holdout-{{ holdout_db }}/train/*" --local-dir ~/scratch/nanort_artifacts
        hf download {{ hf_artifacts_repo }} --repo-type dataset --include "ra-holdout-{{ holdout_db }}/val/*" --local-dir ~/scratch/nanort_artifacts
        for DB in $(ls ~/scratch/nanort_artifacts/ra-holdout-{{ holdout_db }}/train/); do
          ln -sfn ~/scratch/nanort_artifacts/ra-holdout-{{ holdout_db }}/train/$DB ~/scratch/pre/$DB
        done
        ln -sfn ~/scratch/nanort_artifacts/ra-holdout-{{ holdout_db }}/val/{{ holdout_db }} ~/scratch/pre/{{ holdout_db }}

        log_step "Checking relation-aware artifacts"
        pixi run python -u - <<'PY'
        import json
        import os
        from pathlib import Path

        holdout_db = "{{ holdout_db }}"
        pre = Path.home() / "scratch" / "pre"
        required = [
            "table_info.json",
            "column_index.json",
            "relation_text_idxs.json",
            "text_emb_all-MiniLM-L12-v2.bin",
            "nodes.rkyv",
            "offsets.rkyv",
            "p2f_adj.rkyv",
        ]
        all_dbs = ["rel-stack", "rel-amazon", "rel-hm", "rel-avito", "rel-trial", "rel-f1"]
        check_dbs = [db for db in all_dbs if db != holdout_db] + [holdout_db]
        for artifact_db in check_dbs:
            path = pre / artifact_db
            missing = [name for name in required if not (path / name).exists()]
            if missing:
                raise FileNotFoundError(
                    f"{path} is not relation-aware; missing {missing}. "
                    "Build/upload relation-aware holdout artifacts before "
                    "running the 45-minute training YAML."
                )
            rels = json.load(open(path / "relation_text_idxs.json"))
            if not rels:
                raise AssertionError(f"{path}/relation_text_idxs.json is empty")
            print(
                f"[artifact-check] {artifact_db}: relation_types={len(rels)} "
                f"text_emb_size={(path / 'text_emb_all-MiniLM-L12-v2.bin').stat().st_size}",
                flush=True,
            )
        PY

        log_step "Running holdout training (holdout={{ holdout_db }}, optimizer={{ optimizer }}, max_steps={{ max_steps }}, budget={{ time_budget_minutes }}min)"
        pixi run python -u scripts/nanort_train.py \
          --holdout-db {{ holdout_db }} \
          --optimizer {{ optimizer }} \
          --muon-lr {{ muon_lr }} \
          --max-steps {{ max_steps }} \
          --time-budget-minutes {{ time_budget_minutes }} \
          --sigreg-layer {{ sigreg_layer }} \
          --sigreg-lambda-row {{ sigreg_lambda_row }} \
          --sigreg-lambda-col {{ sigreg_lambda_col }} \
          --sigreg-n-proj {{ sigreg_n_proj }} \
          --sigreg-lr {{ sigreg_lr }} \
          --sigreg-min-group {{ sigreg_min_group }} \
          --sigreg-col-pool {{ sigreg_col_pool }} \
          $([ "{{ lr_total_steps }}" -gt 0 ] && echo "--lr-total-steps {{ lr_total_steps }}")

        log_step "Done"
    image: "gabrielmveloso/nanort:cu124-torch2.6"
    name: polyaxon-main
    workingDir: "{{ globals.run_artifacts_path }}/uploads"
    env:
      - name: WANDB_PROJECT
        value: "{{ wandb_project }}"
      - name: WANDB_TAGS
        value: "nanort-train,{{ holdout_db }}"
      - name: WANDB_RUN_GROUP
        value: "nanort-train"
      - name: TEAM_WANDB
        value: franciscokunumi-universidade-federal-de-minas-gerais
      - name: HF_HUB_ENABLE_HF_TRANSFER
        value: "1"
      - name: HF_TOKEN
        value: "{{ hf_token }}"
      - name: NANORT_SEED
        value: "{{ seed }}"
      - name: NANORT_VAL_EVAL_FREQ
        value: "{{ val_eval_freq }}"
      - name: NANORT_BATCH_SIZE
        value: "{{ batch_size }}"
      - name: NANORT_SIMPLICIAL_LAYERS
        value: "{{ simplicial_layers }}"
      - name: NANORT_UPDATE_RELATIONS
        value: "{{ update_relations }}"
      - name: NANORT_QK_NORM
        value: "{{ qk_norm }}"
