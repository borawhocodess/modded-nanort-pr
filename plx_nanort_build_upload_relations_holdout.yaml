version: 1.1
kind: component
name: nanort-build-upload-relations-holdout
description: >
  Full-pipeline relation-aware holdout artifact builder for all 6 RelBench
  databases. For each database: downloads raw RelBench data, runs rustler
  relation-aware preprocessing, embeds the text vocabulary on GPU, and
  validates the artifact, and immediately checkpoints each validated database
  to HuggingFace so retries can resume from the last completed DB. After all
  databases are processed, uploads to HuggingFace in the holdout layout:
    ra-holdout-{DB}/val/{DB}/        ← that database's relation-aware artifact
    ra-holdout-{HOLDOUT}/train/{DB}/ ← each of the 5 training databases
  GPU (H200) required for text embedding. Expect 6–10 hours total.
queue: nebius/default
inputs:
  - name: hf_output_repo
    description: HuggingFace dataset repo to upload artifacts to.
    type: str
    isOptional: false
  - name: embedding_model
    description: SentenceTransformer model used for text embeddings.
    type: str
    isOptional: true
    value: all-MiniLM-L12-v2
  - name: d_text
    description: Text embedding dimensionality.
    type: int
    isOptional: true
    value: 384
  - name: embed_batch_size
    description: GPU embedding batch size.
    type: int
    isOptional: true
    value: 512
  - name: batch_size
    description: Validation sampler batch size.
    type: int
    isOptional: true
    value: 2
  - name: seq_len
    description: Validation sequence length.
    type: int
    isOptional: true
    value: 256
  - name: max_bfs_width
    description: Validation BFS width.
    type: int
    isOptional: true
    value: 256
  - name: num_tasks
    description: Maximum tasks to export per database. Keep high to export all.
    type: int
    isOptional: true
    value: 999
  - name: holdout_db
    description: >
      Which holdout to upload. Set to a specific database (e.g. rel-avito) to
      upload only that holdout's val + train artifacts. Set to "all" to upload
      all 6 holdouts. All 6 databases are always preprocessed regardless, since
      any single holdout requires the other 5 as its training set.
    type: str
    isOptional: true
    value: "all"
  - name: hf_cache_prefix
    description: >
      Prefix used for per-database checkpoint artifacts. Each validated DB is
      uploaded to <hf_cache_prefix>/<db> and future retries restore it from
      there before rebuilding.
    type: str
    isOptional: true
    value: relation-aware
  - name: use_hf_cache
    description: Whether to restore per-database artifacts from HuggingFace before rebuilding.
    type: str
    isOptional: true
    value: "true"
  - name: wandb_project
    description: W&B project name for build progress tracking.
    type: str
    isOptional: true
    value: nanort-build-relations-holdout
  - name: hf_token
    description: HuggingFace token for RelBench download and artifact upload.
    type: str
    isOptional: true
    value: ""
  - name: relbench_hash_overrides
    description: >
      Optional comma-separated RelBench download hash overrides, formatted as
      path=sha256. Used when the server artifact changed before the relbench
      package registry was updated.
    type: str
    isOptional: true
    value: "rel-stack/db.zip=5a97bf65a926529143e96f6413b2b0550ca55c01247f85156bfb999ee903e94e"
cache:
  disable: true
termination:
  maxRetries: 0
  timeout: 43200
run:
  kind: job
  connections: [wandb-connection]
  environment:
    nodeSelector:
      polyaxon: h200
  container:
    resources:
      limits:
        nvidia.com/gpu: "1"
    image: "pytorch/pytorch:2.5.0-cuda12.4-cudnn9-devel"
    name: polyaxon-main
    workingDir: "{{ globals.run_artifacts_path }}/uploads"
    command:
      - bash
      - "-lc"
      - |
        exec > >(tee {{ globals.run_outputs_path }}/log.txt) 2>&1
        set -euxo pipefail
        export PYTHONUNBUFFERED=1

        log_step() {
          echo
          echo "================================================================"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"
          echo "================================================================"
        }

        log_step "Starting relation-aware holdout build job"
        echo "hf_output_repo={{ hf_output_repo }}"
        echo "embedding_model={{ embedding_model }}"
        echo "d_text={{ d_text }}"
        echo "embed_batch_size={{ embed_batch_size }}"
        echo "validation batch_size={{ batch_size }}"
        echo "validation seq_len={{ seq_len }}"
        echo "validation max_bfs_width={{ max_bfs_width }}"
        echo "validation num_tasks={{ num_tasks }}"
        echo "hf_cache_prefix={{ hf_cache_prefix }}"
        echo "use_hf_cache={{ use_hf_cache }}"
        echo "relbench_hash_overrides={{ relbench_hash_overrides }}"

        log_step "Installing system packages"
        apt-get update
        apt-get install -y curl build-essential pkg-config

        log_step "Installing pixi"
        curl -fsSL https://pixi.sh/install.sh | sh
        export PATH="$HOME/.pixi/bin:$PATH"

        log_step "Installing pixi environment"
        cd {{ globals.run_artifacts_path }}/uploads
        pixi install

        log_step "Installing relbench into pixi environment"
        pixi run uv pip install relbench

        log_step "Building rustler extension"
        cd rustler
        pixi run maturin develop --uv --release
        cd ..

        log_step "Installing HuggingFace CLI helpers and W&B"
        pip3 install --root-user-action ignore huggingface_hub hf_transfer wandb

        log_step "Exporting environment variables"
        export HF_HUB_ENABLE_HF_TRANSFER=1
        export HF_HOME="$HOME/.cache/huggingface"
        export SENTENCE_TRANSFORMERS_HOME="$HF_HOME/sentence-transformers"
        set +x
        export HF_TOKEN="{{ hf_token }}"
        if [ -z "$HF_TOKEN" ]; then
          echo "[hf] hf_token is required for uploading to HuggingFace" >&2
          exit 2
        fi
        echo "[hf] token provided"
        set -x
        export HF_OUTPUT_REPO="{{ hf_output_repo }}"
        export EMBEDDING_MODEL="{{ embedding_model }}"
        export D_TEXT="{{ d_text }}"
        export EMBED_BATCH_SIZE="{{ embed_batch_size }}"
        export BATCH_SIZE="{{ batch_size }}"
        export SEQ_LEN="{{ seq_len }}"
        export MAX_BFS_WIDTH="{{ max_bfs_width }}"
        export NUM_TASKS="{{ num_tasks }}"
        export WANDB_PROJECT="{{ wandb_project }}"
        export WANDB_RUN_ID="{{ globals.uuid }}"
        export WANDB_RUN_NAME="build-relations-holdout-{{ holdout_db }}-{{ globals.uuid }}"
        export TEAM_WANDB="franciscokunumi-universidade-federal-de-minas-gerais"
        export RELBENCH_HASH_OVERRIDES="{{ relbench_hash_overrides }}"
        export HF_CACHE_PREFIX="{{ hf_cache_prefix }}"
        export USE_HF_CACHE="{{ use_hf_cache }}"

        log_step "Initialising W&B run"
        python3 -c "import wandb,os; wandb.init(project=os.environ['WANDB_PROJECT'],id=os.environ['WANDB_RUN_ID'],name=os.environ['WANDB_RUN_NAME'],entity=os.environ['TEAM_WANDB'],resume='allow',config={'holdout_db':'{{ holdout_db }}','embedding_model':'{{ embedding_model }}','hf_output_repo':'{{ hf_output_repo }}'}); wandb.log({'phase':'init','db':'','db_idx':0,'total_dbs':6}); wandb.finish(quiet=True)"

        wb_log() {
          local db=$1 phase=$2 db_idx=$3
          python3 -c "import wandb,os; wandb.init(project=os.environ['WANDB_PROJECT'],id=os.environ['WANDB_RUN_ID'],entity=os.environ['TEAM_WANDB'],resume='allow'); wandb.log({'db':'$db','phase':'$phase','db_idx':$db_idx}); wandb.finish(quiet=True)" 2>/dev/null || true
        }

        log_step "Pre-downloading SentenceTransformer model"
        MODEL_DIR="sentence-transformers/$EMBEDDING_MODEL"
        mkdir -p "$MODEL_DIR"
        hf download "sentence-transformers/$EMBEDDING_MODEL" \
          --repo-type model \
          --local-dir "$MODEL_DIR"
        test -f "$MODEL_DIR/config.json"
        test -f "$MODEL_DIR/modules.json"
        find "$MODEL_DIR" -maxdepth 2 -type f | sort | head -20

        artifact_ready() {
          local path=$1
          test -f "$path/table_info.json" \
            && test -f "$path/column_index.json" \
            && test -f "$path/relation_text_idxs.json" \
            && test -f "$path/text_emb_$EMBEDDING_MODEL.bin" \
            && test -f "$path/nodes.rkyv" \
            && test -f "$path/offsets.rkyv" \
            && test -f "$path/p2f_adj.rkyv"
        }

        restore_hf_cache() {
          local db=$1
          local cache_path="$HF_CACHE_PREFIX/$db"
          local pre_path="$HOME/scratch/pre/$db"
          local cache_root="$HOME/scratch/hf-cache-download/$db"

          if [ "$USE_HF_CACHE" != "true" ]; then
            echo "[cache] restore disabled for $db"
            return 1
          fi

          log_step "[$db] Checking HF cache at $HF_OUTPUT_REPO/$cache_path"
          rm -rf "$cache_root"
          mkdir -p "$cache_root"
          if hf download "$HF_OUTPUT_REPO" \
              --repo-type dataset \
              --include "$cache_path/*" \
              --local-dir "$cache_root"; then
            if artifact_ready "$cache_root/$cache_path"; then
              rm -rf "$pre_path"
              mkdir -p "$HOME/scratch/pre"
              cp -a "$cache_root/$cache_path" "$pre_path"
              echo "[cache] restored $db from $HF_OUTPUT_REPO/$cache_path"
              return 0
            fi
            echo "[cache] incomplete cache for $db at $cache_path; rebuilding"
          else
            echo "[cache] cache miss for $db at $cache_path; rebuilding"
          fi
          return 1
        }

        ALL_DBS="rel-stack rel-amazon rel-hm rel-avito rel-trial rel-f1"
        DB_IDX=0

        # ── Phase 1: process each database ────────────────────────────────────
        for DATASET_DB in $ALL_DBS; do
          export DATASET_DB
          DB_IDX=$((DB_IDX + 1))
          CACHE_HIT=0
          if restore_hf_cache "$DATASET_DB"; then
            CACHE_HIT=1
            wb_log "$DATASET_DB" "cache_hit" "$DB_IDX"
            log_step "[$DATASET_DB] Restored artifact from HF cache; skipping export/preprocess/embed"
          else
            wb_log "$DATASET_DB" "export_start" "$DB_IDX"
            log_step "[$DATASET_DB] Downloading and exporting raw RelBench data"
            pixi run python -u - <<'PY'
        import os
        import shutil
        from pathlib import Path

        import relbench.datasets as relbench_datasets
        from relbench.datasets import get_dataset
        from relbench.tasks import get_task, get_task_names

        from rt.tasks import all_tasks

        dataset_db = os.environ["DATASET_DB"]
        num_tasks = int(os.environ["NUM_TASKS"])
        raw_root = Path.home() / "scratch" / "relbench" / dataset_db

        overrides = os.environ.get("RELBENCH_HASH_OVERRIDES", "").strip()
        if overrides:
            for item in overrides.split(","):
                item = item.strip()
                if not item:
                    continue
                path, sha256 = item.split("=", 1)
                path = path.strip()
                sha256 = sha256.strip()
                print(f"[export] overriding RelBench hash for {path}: {sha256}", flush=True)
                relbench_datasets.DOWNLOAD_REGISTRY.registry[path] = sha256

        print(f"[export] preparing raw root: {raw_root}", flush=True)
        if raw_root.exists():
            print(f"[export] removing previous raw root: {raw_root}", flush=True)
            shutil.rmtree(raw_root)
        (raw_root / "db").mkdir(parents=True)
        (raw_root / "tasks").mkdir(parents=True)

        print(f"[export] downloading dataset {dataset_db}", flush=True)
        dataset = get_dataset(dataset_db, download=True)
        print("[export] loading full DB", flush=True)
        db = dataset.get_db(upto_test_timestamp=False)
        print(f"[export] saving DB parquet files to {raw_root / 'db'}", flush=True)
        db.save(raw_root / "db")

        wanted_tasks = [task for db_name, task, _, _ in all_tasks if db_name == dataset_db]
        available_tasks = set(get_task_names(dataset_db))
        print(f"[export] available tasks: {sorted(available_tasks)}", flush=True)
        print(f"[export] wanted tasks: {wanted_tasks}", flush=True)
        exported = []
        for task_name in wanted_tasks:
            if len(exported) >= num_tasks:
                break
            if task_name not in available_tasks:
                print(f"[export] skipping unavailable task: {task_name}", flush=True)
                continue

            print(f"[export] downloading task: {task_name}", flush=True)
            task = get_task(dataset_db, task_name, download=True)
            task_dir = raw_root / "tasks" / task_name
            task_dir.mkdir(parents=True)
            written_splits = []
            for split in ["train", "val", "test"]:
                if hasattr(task, "get_table"):
                    if split == "test":
                        try:
                            table = task.get_table(split, mask_input_cols=False)
                        except TypeError:
                            table = task.get_table(split)
                    else:
                        table = task.get_table(split)
                else:
                    table = getattr(task, f"{split}_table", None)
                if table is not None:
                    print(f"[export] saving {task_name}/{split}.parquet", flush=True)
                    table.save(task_dir / f"{split}.parquet")
                    written_splits.append(split)
                else:
                    print(f"[export] missing {task_name}/{split} table", flush=True)
            if not written_splits:
                raise RuntimeError(f"Task {task_name} produced no split parquet files")
            print(f"[export] task {task_name} splits: {written_splits}", flush=True)
            exported.append(task_name)

        if not exported:
            raise RuntimeError(f"No tasks exported for {dataset_db}")

        task_parquets = sorted(raw_root.glob("tasks/*/*.parquet"))
        print(f"[export] task parquet count: {len(task_parquets)}", flush=True)
        for path in task_parquets[:50]:
            print(f"[export] task parquet: {path.relative_to(raw_root)}", flush=True)

        print(f"Exported {dataset_db} to {raw_root}")
        print(f"Tasks: {exported}")
        PY

            wb_log "$DATASET_DB" "preprocess_start" "$DB_IDX"
            log_step "[$DATASET_DB] Running rustler preprocessing"
            cd rustler
            pixi run cargo run --release -- pre "$DATASET_DB"
            cd ..

            log_step "[$DATASET_DB] Cleaning up raw RelBench data"
            rm -rf "$HOME/scratch/relbench/$DATASET_DB"

            wb_log "$DATASET_DB" "embed_start" "$DB_IDX"
            log_step "[$DATASET_DB] Embedding text vocabulary on CUDA"
            pixi run python -u - <<'PY'
        import os
        import torch
        from rt.embed import main

        if not torch.cuda.is_available():
            raise RuntimeError("CUDA is required to build production text embeddings.")

        print(f"[embed] CUDA device count: {torch.cuda.device_count()}", flush=True)
        print(f"[embed] current CUDA device: {torch.cuda.current_device()}", flush=True)
        print(f"[embed] dataset={os.environ['DATASET_DB']}", flush=True)
        print(f"[embed] model={os.environ['EMBEDDING_MODEL']}", flush=True)
        print(f"[embed] batch_size={os.environ['EMBED_BATCH_SIZE']}", flush=True)
        main(
            dataset_name=os.environ["DATASET_DB"],
            device="cuda",
            batch_size=int(os.environ["EMBED_BATCH_SIZE"]),
            embedding_model=os.environ["EMBEDDING_MODEL"],
        )
        PY
          fi

          wb_log "$DATASET_DB" "validate_start" "$DB_IDX"
          log_step "[$DATASET_DB] Validating relation-aware sampler outputs"
          pixi run python -u - <<'PY'
        import json
        import os
        from pathlib import Path

        import torch

        from rt.data import RelationalDataset
        from rt.tasks import all_tasks

        dataset_db = os.environ["DATASET_DB"]
        embedding_model = os.environ["EMBEDDING_MODEL"]
        d_text = int(os.environ["D_TEXT"])
        batch_size = int(os.environ["BATCH_SIZE"])
        seq_len = int(os.environ["SEQ_LEN"])
        max_bfs_width = int(os.environ["MAX_BFS_WIDTH"])
        num_tasks = int(os.environ["NUM_TASKS"])

        pre_path = Path.home() / "scratch" / "pre" / dataset_db
        print(f"[validate] checking artifact at {pre_path}", flush=True)
        required = [
            "table_info.json",
            "column_index.json",
            "relation_text_idxs.json",
            f"text_emb_{embedding_model}.bin",
            "nodes.rkyv",
            "offsets.rkyv",
            "p2f_adj.rkyv",
        ]
        missing = [name for name in required if not (pre_path / name).exists()]
        if missing:
            raise FileNotFoundError(f"{pre_path} is missing {missing}")
        print(f"[validate] required files found: {required}", flush=True)

        with open(pre_path / "relation_text_idxs.json") as f:
            relation_text_idxs = json.load(f)
        if not relation_text_idxs:
            raise AssertionError("relation_text_idxs.json is empty")
        print(f"[validate] relation types: {len(relation_text_idxs)}", flush=True)

        with open(pre_path / "table_info.json") as f:
            table_info = json.load(f)
        print(f"[validate] table_info keys: {sorted(table_info)[:50]}", flush=True)
        split_counts = {
            split: sum(key.endswith(f":{split}") for key in table_info)
            for split in ["Db", "Train", "Val", "Test"]
        }
        print(f"[validate] table_info split counts: {split_counts}", flush=True)
        if split_counts["Train"] == 0:
            raise AssertionError(
                "No :Train task tables were preprocessed. The artifact cannot train."
            )
        if split_counts["Val"] == 0:
            raise AssertionError(
                "No :Val task tables were preprocessed. The artifact cannot validate."
            )

        tasks = [
            (dataset_db, table, target, "train", drop)
            for db_name, table, target, drop in all_tasks
            if db_name == dataset_db
            and f"{table}:Train" in table_info
        ][:num_tasks]
        if not tasks:
            raise AssertionError(
                f"No validation tasks available for {dataset_db}. "
                f"table_info keys: {sorted(table_info)}"
            )
        print(f"[validate] tasks: {tasks}", flush=True)

        print("[validate] constructing RelationalDataset", flush=True)
        dataset = RelationalDataset(
            tasks=tasks,
            batch_size=batch_size,
            seq_len=seq_len,
            rank=0,
            world_size=1,
            max_bfs_width=max_bfs_width,
            embedding_model=embedding_model,
            d_text=d_text,
            seed=0,
        )
        print(f"[validate] dataset length: {len(dataset)}", flush=True)
        print("[validate] sampling batch 0", flush=True)
        batch = dataset[0]
        print(f"[validate] batch keys: {sorted(batch.keys())}", flush=True)

        for key in ["f2p_nbr_idxs", "f2p_rel_idxs", "relation_embs", "r_mask"]:
            if key not in batch:
                raise AssertionError(f"Missing batch key: {key}")

        if batch["f2p_rel_idxs"].shape != batch["f2p_nbr_idxs"].shape:
            raise AssertionError("f2p_rel_idxs shape does not match f2p_nbr_idxs")

        relation_embs = batch["relation_embs"]
        r_mask = batch["r_mask"]
        if relation_embs.shape != (len(relation_text_idxs), d_text):
            raise AssertionError(
                f"relation_embs shape {tuple(relation_embs.shape)} does not match "
                f"({len(relation_text_idxs)}, {d_text})"
            )
        if relation_embs.dtype != torch.bfloat16:
            raise AssertionError(f"relation_embs dtype is {relation_embs.dtype}")
        if r_mask.shape != (len(relation_text_idxs),) or r_mask.dtype != torch.bool:
            raise AssertionError(f"r_mask shape/dtype is {r_mask.shape}/{r_mask.dtype}")

        valid_rel = batch["f2p_rel_idxs"] >= 0
        valid_nbr = batch["f2p_nbr_idxs"] >= 0
        if not torch.equal(valid_rel, valid_nbr):
            raise AssertionError("f2p_rel_idxs validity does not match f2p_nbr_idxs")
        if not valid_rel.any():
            raise AssertionError("No f2p relation edges appeared in the validation batch")
        if batch["f2p_rel_idxs"][valid_rel].max() >= relation_embs.shape[0]:
            raise AssertionError("f2p_rel_idxs contains an out-of-range relation id")

        summary = {
            "dataset_db": dataset_db,
            "dataset_len": len(dataset),
            "batch_node_shape": list(batch["node_idxs"].shape),
            "f2p_shape": list(batch["f2p_rel_idxs"].shape),
            "num_relation_types": int(relation_embs.shape[0]),
            "num_relation_edges_in_batch": int(valid_rel.sum()),
        }
        print(json.dumps(summary, indent=2))
        print(f"OK: {dataset_db} relation-aware artifact validated.")
        PY

          if [ "$CACHE_HIT" -eq 0 ]; then
            wb_log "$DATASET_DB" "cache_upload_start" "$DB_IDX"
            log_step "[$DATASET_DB] Uploading per-DB checkpoint to $HF_CACHE_PREFIX/$DATASET_DB"
            hf upload "$HF_OUTPUT_REPO" \
              "$HOME/scratch/pre/$DATASET_DB" \
              "$HF_CACHE_PREFIX/$DATASET_DB" \
              --repo-type dataset
            wb_log "$DATASET_DB" "cache_upload_done" "$DB_IDX"
          else
            wb_log "$DATASET_DB" "cache_validated" "$DB_IDX"
          fi

          wb_log "$DATASET_DB" "done" "$DB_IDX"
        done

        # ── Phase 2: upload in holdout layout ─────────────────────────────────
        log_step "Uploading artifacts in holdout layout"

        if [ "{{ holdout_db }}" = "all" ]; then
          HOLDOUTS="$ALL_DBS"
        else
          HOLDOUTS="{{ holdout_db }}"
        fi

        UPLOAD_IDX=0
        for HOLDOUT in $HOLDOUTS; do
          UPLOAD_IDX=$((UPLOAD_IDX + 1))
          wb_log "$HOLDOUT" "upload_val" "$UPLOAD_IDX"
          log_step "Uploading ra-holdout-$HOLDOUT/val/$HOLDOUT"
          hf upload "$HF_OUTPUT_REPO" \
            "$HOME/scratch/pre/$HOLDOUT" \
            "ra-holdout-$HOLDOUT/val/$HOLDOUT" \
            --repo-type dataset

          for TRAIN_DB in $ALL_DBS; do
            if [ "$TRAIN_DB" != "$HOLDOUT" ]; then
              wb_log "$TRAIN_DB" "upload_train/$HOLDOUT" "$UPLOAD_IDX"
              log_step "Uploading ra-holdout-$HOLDOUT/train/$TRAIN_DB"
              hf upload "$HF_OUTPUT_REPO" \
                "$HOME/scratch/pre/$TRAIN_DB" \
                "ra-holdout-$HOLDOUT/train/$TRAIN_DB" \
                --repo-type dataset
            fi
          done

          wb_log "$HOLDOUT" "upload_done" "$UPLOAD_IDX"
          printf "ra-holdout-%s done: %s/ra-holdout-%s\n" \
            "$HOLDOUT" "$HF_OUTPUT_REPO" "$HOLDOUT" \
            | tee -a {{ globals.run_outputs_path }}/upload_summary.txt
        done

        log_step "Writing artifact manifest"
        for DB in $ALL_DBS; do
          echo "=== $DB ==="
          find "$HOME/scratch/pre/$DB" -maxdepth 1 -type f | sort
        done | tee {{ globals.run_outputs_path }}/artifact_manifest.txt
        printf "%s\n" "$HF_OUTPUT_REPO" > {{ globals.run_outputs_path }}/hf_artifact_repo.txt

        log_step "Done"
