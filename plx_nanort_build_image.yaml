version: 1.1
kind: component
name: nanort-build-image
description: >
  Build and push the pre-baked nanoRT training image with Kaniko, in-cluster,
  on linux/amd64 (native — no QEMU) and WITHOUT a GPU. Produces the image that
  plx_nanort_train.yaml references in `image:`. Run with `-u` so the Dockerfile
  and its build context (pyproject.toml, pixi.lock, rustler/) are uploaded:

    polyaxon run -f plx_nanort_build_image.yaml -u \
      -P docker_username=gabrielmveloso \
      -P docker_token=$DOCKERHUB_TOKEN
queue: nebius/default

inputs:
  - name: image_destination
    description: Full image ref to push (must match `image:` in plx_nanort_train.yaml).
    type: str
    isOptional: true
    value: "gabrielmveloso/nanort:cu124-torch2.6"
  - name: docker_username
    description: Docker Hub username used to push.
    type: str
    isOptional: false
  - name: docker_token
    description: >
      Docker Hub access token — create a revocable token (Docker Hub > Account
      Settings > Security), NOT your account password. It is rendered into the
      job command, so it is visible in this run's logs/UI; revoke it afterwards.
    type: str
    isOptional: false

cache:
  disable: true
termination:
  maxRetries: 0

run:
  kind: job
  # No GPU: image build is CPU/disk-bound. No H200 nodeSelector, so the job
  # never lands on (or wastes) a GPU node.
  container:
    image: gcr.io/kaniko-project/executor:debug
    resources:
      requests:
        cpu: "4"
        memory: "12Gi"
        ephemeral-storage: "50Gi"
      limits:
        cpu: "8"
        memory: "24Gi"
        ephemeral-storage: "90Gi"
    command: ["/busybox/sh", "-c"]
    args:
      - |
        set -eu

        echo "[build] preparing Docker Hub auth"
        AUTH=$(printf '%s:%s' "{{ docker_username }}" "{{ docker_token }}" | base64 | tr -d '\n')
        mkdir -p /kaniko/.docker
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" \
          > /kaniko/.docker/config.json

        echo "[build] kaniko build + push -> {{ image_destination }}"
        # --compressed-caching=false keeps kaniko from holding the (large
        # torch/CUDA) layers compressed in RAM; --snapshot-mode=redo is faster
        # and lighter for many-file layers.
        /kaniko/executor \
          --context=dir://{{ globals.run_artifacts_path }}/uploads \
          --dockerfile=Dockerfile \
          --destination={{ image_destination }} \
          --compressed-caching=false \
          --snapshot-mode=redo \
          --cleanup

        echo "[build] done: {{ image_destination }}"
